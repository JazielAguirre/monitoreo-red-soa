<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:248px;height:100%;min-height:100%;box-sizing:border-box;background:#0B1D2E;display:flex;flex-direction:column;padding:22px 14px 18px;gap:28px;font-family:Inter,system-ui,sans-serif">
<div style="display:flex;align-items:center;gap:12px;padding:0 8px">
<div style="position:relative;width:38px;height:38px;border-radius:10px;background:#16324F;display:grid;place-items:center;color:#8CBCEB;font-size:18px;flex:none"><i class="bi bi-diagram-3-fill"></i><span style="position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 2px #16324F"></span></div>
<div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600;color:#fff;line-height:20px">Monitoreo de Red</span><span style="font-size:12px;color:#8FA3B8">SOA · Laboratorio</span></div>
</div>
<nav style="display:flex;flex-direction:column;gap:2px">
<div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#6B8299;padding:0 12px 8px">MENÚ</div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;background:{{ it.bg }};color:{{ it.fg }};font-size:14px;font-weight:500;cursor:pointer"><i class="{{ it.icon }}" style="font-size:16px;color:{{ it.ic }}"></i>{{ it.label }}<sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#F59E0B;color:#0B1D2E;font-size:11px;font-weight:700;display:grid;place-items:center;box-sizing:border-box">{{ it.count }}</span></sc-if></div>
</sc-for>
</nav>
<div style="margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:16px 8px 0;display:flex;align-items:center;gap:12px">
<span style="width:34px;height:34px;border-radius:50%;background:#16324F;color:#D5E1EC;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none">AD</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:13.5px;font-weight:500;color:#fff">Administrador</span><span style="font-size:12px;color:#8FA3B8">admin</span></div>
<span style="width:32px;height:32px;border-radius:8px;color:#8FA3B8;display:grid;place-items:center;font-size:16px;cursor:pointer" style-hover="background:rgba(255,255,255,.06);color:#FFFFFF" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></span>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;dispositivos&quot;,&quot;monitoreos&quot;,&quot;alertas&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alerts&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const n = this.props.alerts ?? 0;
    const items = [
      { k: 'dashboard', label: 'Dashboard', icon: 'bi bi-grid-1x2' },
      { k: 'dispositivos', label: 'Dispositivos', icon: 'bi bi-hdd-network' },
      { k: 'monitoreos', label: 'Monitoreos', icon: 'bi bi-activity' },
      { k: 'alertas', label: 'Alertas', icon: 'bi bi-bell' }
    ].map(it => {
      const on = it.k === active;
      return { ...it, bg: on ? '#16324F' : 'transparent', fg: on ? '#FFFFFF' : '#B6C4D3', ic: on ? '#8CBCEB' : 'inherit', hasCount: it.k === 'alertas' && n > 0, count: n };
    });
    return { items };
  }
}
</script>
</body>
</html>
